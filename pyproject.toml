[project]
name = "rendition"
version = "0.1.0"
description = "Distributed Video Transcoding System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "boto3>=1.43.18",
    "fastapi>=0.128.0",
    "pika>=1.3.2",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pyright>=1.1.400",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
include = ["api", "core", "worker", "tests", "alembic"]
